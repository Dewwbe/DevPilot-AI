# Production cluster: HA, autoscaling, trusted certificates, metrics scraped by Prometheus.
config:
  DEVPILOT_ENV: production
  DEVPILOT_REPO_DAILY_TOKEN_BUDGET: "200000"

secrets:
  secretId: devpilot-prod/app

api:
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 65
  pdb: { enabled: true, minAvailable: 1 }

worker:
  replicas: 2

web:
  replicas: 2

ingress:
  host: devpilot.example.com
  tls:
    clusterIssuer: letsencrypt-prod

monitoring:
  serviceMonitor: true
