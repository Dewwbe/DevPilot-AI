{{- if and .Values.ingress.tls.enabled .Values.certManager.createClusterIssuers }}
{{- if not .Values.certManager.email }}{{ fail "certManager.email is required to create ClusterIssuers" }}{{ end }}
# cert-manager must already be installed (scripts/eks-addons.sh). ClusterIssuers are cluster-wide,
# so create them from one release only.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: {{ .Values.certManager.email | quote }}
    privateKeySecretRef: { name: letsencrypt-staging-account-key }
    solvers: [{ http01: { ingress: { ingressClassName: {{ .Values.ingress.className }} } } }]
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.certManager.email | quote }}
    privateKeySecretRef: { name: letsencrypt-prod-account-key }
    solvers: [{ http01: { ingress: { ingressClassName: {{ .Values.ingress.className }} } } }]
{{- end }}
