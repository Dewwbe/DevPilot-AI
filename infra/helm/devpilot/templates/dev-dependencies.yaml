{{- if .Values.devDependencies.enabled }}
# LOCAL CLUSTERS ONLY (kind/minikube): single-replica Postgres and Redis with throwaway storage.
# Use managed services (RDS/ElastiCache) everywhere else.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "devpilot.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "devpilot.selector" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "devpilot.selector" (dict "root" . "component" "postgres") | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: devpilot }
            - { name: POSTGRES_PASSWORD, value: devpilot }
            - { name: POSTGRES_DB, value: devpilot }
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  selector: {{- include "devpilot.selector" (dict "root" . "component" "postgres") | nindent 4 }}
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-redis
  labels: {{- include "devpilot.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "devpilot.selector" (dict "root" . "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "devpilot.selector" (dict "root" . "component" "redis") | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redis
spec:
  selector: {{- include "devpilot.selector" (dict "root" . "component" "redis") | nindent 4 }}
  ports: [{ port: 6379 }]
{{- end }}
