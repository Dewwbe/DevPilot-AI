{{- if .Values.secrets.enabled }}
# Reads one Secrets Manager JSON secret through the Secrets Store CSI driver (AWS provider) and
# syncs it to Kubernetes Secrets at pod start. The values never appear in git or in Helm values.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Release.Name }}-secrets
  labels: {{- include "devpilot.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    region: {{ .Values.secrets.providerRegion | quote }}
    objects: |
      - objectName: {{ .Values.secrets.secretId | quote }}
        objectType: "secretsmanager"
        jmesPath:
          {{- range $key, $env := (include "devpilot.secretMap" . | fromYaml) }}
          - path: {{ $key }}
            objectAlias: {{ $key }}
          {{- end }}
          {{- if .Values.ingress.basicAuth.enabled }}
          - path: {{ .Values.secrets.basicAuthKey }}
            objectAlias: basic_auth
          {{- end }}
  secretObjects:
    - secretName: {{ .Release.Name }}-secrets
      type: Opaque
      data:
        {{- range $key, $env := (include "devpilot.secretMap" . | fromYaml) }}
        - objectName: {{ $key }}
          key: {{ $env }}
        {{- end }}
    {{- if .Values.ingress.basicAuth.enabled }}
    - secretName: {{ .Release.Name }}-basic-auth
      type: Opaque
      data:
        - objectName: basic_auth
          key: auth  # the key name ingress-nginx expects
    {{- end }}
{{- end }}
