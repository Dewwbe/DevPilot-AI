apiVersion: apps/v1
kind: Deployment
metadata:
  name: devpilot-api
  namespace: devpilot
  labels: { app: devpilot-api }
spec:
  replicas: 2
  selector: { matchLabels: { app: devpilot-api } }
  template:
    metadata: { labels: { app: devpilot-api } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: api
          image: devpilot-api:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: devpilot-config }
            - secretRef: { name: devpilot-secrets }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          livenessProbe: { httpGet: { path: /healthz, port: 8000 }, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /readyz, port: 8000 }, periodSeconds: 10 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: devpilot
spec:
  selector: { app: devpilot-api }
  ports: [{ port: 8000, targetPort: 8000 }]
