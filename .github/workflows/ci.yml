name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest --cov=app --cov-report=xml
      - name: Dependency vulnerability audit
        run: pip install pip-audit && pip-audit

  evals:
    # Offline evals on every PR: heuristic classifier + full pipeline with a FakeClaude.
    # Fails if accuracy drops below evals/baseline.json or a guardrail check breaks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e "backend[dev]"
      - run: python evals/run_evals.py --mode heuristic
      - run: python evals/run_evals.py --mode fake
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-reports, path: evals/results/ }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run lint && npm run build

  containers:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t devpilot-api:${{ github.sha }} backend
      - run: docker build -t devpilot-web:${{ github.sha }} frontend
      - run: docker build -t devpilot-runner:${{ github.sha }} backend/runner
      - name: Image vulnerability report (HIGH and CRITICAL, informational)
        uses: aquasecurity/trivy-action@v0.24.0
        with: { image-ref: "devpilot-api:${{ github.sha }}", severity: "CRITICAL,HIGH", exit-code: "0", ignore-unfixed: true }
      - name: Fail on CRITICAL vulnerabilities with a fix available (api)
        uses: aquasecurity/trivy-action@v0.24.0
        with: { image-ref: "devpilot-api:${{ github.sha }}", severity: "CRITICAL", exit-code: "1", ignore-unfixed: true }
      - name: Fail on CRITICAL vulnerabilities with a fix available (web)
        uses: aquasecurity/trivy-action@v0.24.0
        with: { image-ref: "devpilot-web:${{ github.sha }}", severity: "CRITICAL", exit-code: "1", ignore-unfixed: true }
      - name: Validate Kubernetes manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -ignore-filename-pattern kustomization infra/k8s/base
      - name: Install Helm
        run: curl -fsSL https://get.helm.sh/helm-v3.15.4-linux-amd64.tar.gz | tar xz && sudo mv linux-amd64/helm /usr/local/bin/
      - name: Lint and validate the Helm chart (dev and prod values)
        run: |
          for env in dev prod; do
            args="-f infra/helm/devpilot/values-$env.yaml --set config.DEVPILOT_REDIS_URL=redis://redis:6379/0 --set certManager.email=ci@example.com"
            helm lint infra/helm/devpilot $args
            helm template rel infra/helm/devpilot $args               | ./kubeconform -strict -summary -schema-location default                   -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -
          done
      - name: Validate Terraform (ECS and EKS stacks)
        run: |
          curl -fsSL https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip -o tf.zip
          unzip -q tf.zip terraform && sudo mv terraform /usr/local/bin/
          for dir in infra/terraform infra/terraform-eks; do
            terraform -chdir=$dir fmt -check -recursive
            terraform -chdir=$dir init -backend=false -input=false >/dev/null
            terraform -chdir=$dir validate
          done
